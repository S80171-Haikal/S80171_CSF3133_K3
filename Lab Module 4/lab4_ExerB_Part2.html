<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- Requirement 7: Viewport meta tag for responsive scaling on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Café Campus</title>

    <!-- Requirement 5: Link to the external stylesheet cafe.css -->
    <link rel="stylesheet" href="cafe.css">

    <!-- Internal CSS for page-specific typography and link states -->
    <style type="text/css">
        a:link {
            color: #1A5276;
        }
        a:visited {
            color: #7D3C98;
        }
        a:hover {
            color: #E67E22;
        }
        a:active {
            color: #C0392B;
        }
        h1 {
            text-decoration: overline;
        }
        p {
            color: #333333;
            text-align: justify;
        }
        .intro {
            font-size: 18px;
            background-color: #FDEBD0;
            padding: 10px;
        }
        .highlight {
            font-weight: bold;
            color: #C0392B;
        }
    </style>
</head>
<body>
    <header>
        <h1>e-Café Campus</h1>
    </header>

    <!-- Requirement 5 & 8: Navigation bar with link to the new Feedback section -->
    <nav>
        <ul>
            <li><a href="#menu">Menu</a></li>
            <li><a href="#video">Video</a></li>
            <li><a href="#feedback">Feedback</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Menu Section with Promotional Pricing -->
    <section id="menu">
        <h2>Today's Menu</h2>
        <p class="intro">Freshly brewed coffee and local delights every day.</p>
        
        <!-- Requirement 6: Old price crossed out using .old-price followed by promotional price -->
        <article class="item">
            <h3>Kopi Tarik</h3>
            <p>
                Only <span class="old-price">RM 4.50</span> 
                <span class="highlight">RM 3.50</span>
            </p>
        </article>

        <article class="item">
            <h3>Nasi Lemak</h3>
            <p>
                Only <span class="old-price">RM 6.50</span> 
                <span class="highlight">RM 5.00</span>
            </p>
        </article>
    </section>

    <!-- Requirement 7: Video Section using <figure> and <figcaption> -->
    <section id="video">
        <h2>Watch Our Story</h2>
        <figure>
            <video width="400" height="300" controls>
                <source src="cafe.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <figcaption>A behind-the-scenes look at how we brew our signature campus coffee.</figcaption>
        </figure>
    </section>

    <!-- Requirement 8: New Customer Feedback Section and Form -->
    <section id="feedback">
        <h2>Share Your Feedback</h2>
        <form class="feedback-form" action="#" method="post">
            <!-- Text Input for Name -->
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <!-- Email Input -->
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <!-- Radio Buttons for Visit Type -->
            <div class="form-group">
                <label>Visit Type:</label>
                <label class="inline-option">
                    <input type="radio" name="visit_type" value="Dine-in" checked> Dine-in
                </label>
                <label class="inline-option">
                    <input type="radio" name="visit_type" value="Take-away"> Take-away
                </label>
            </div>

            <!-- Checkboxes for Favourite Items -->
            <div class="form-group">
                <label>Favourite Items:</label>
                <label class="inline-option">
                    <input type="checkbox" name="favourites" value="Kopi Tarik"> Kopi Tarik
                </label>
                <label class="inline-option">
                    <input type="checkbox" name="favourites" value="Nasi Lemak"> Nasi Lemak
                </label>
                <label class="inline-option">
                    <input type="checkbox" name="favourites" value="Roti Bakar"> Roti Bakar
                </label>
                <label class="inline-option">
                    <input type="checkbox" name="favourites" value="Teh Tarik"> Teh Tarik
                </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Submit Feedback</button>
        </form>
    </section>
    
    <!-- Requirement 9: Footer with <address> element and mailto: link -->
    <footer id="contact">
        <p>&copy; 2026 e-Café Campus</p>
        <address>
            Email us at: <a href="mailto:ecafe@campus.edu.my">ecafe@campus.edu.my</a>
        </address>
    </footer>
</body>
</html>
