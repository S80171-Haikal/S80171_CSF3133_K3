<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="utf-8"> 
    <title>Ticket Booking</title> 
</head> 
<body>
    <!--Error 1 (Line 1): Missing html in <!DOCTYPE html> -->
    <!--Error 2 (Line 12): Missing closing span tag -->
    <!--Error 3 (Line 12): End tag h1 seen, but there were open elements.-->
    <!--Error 4 (Line 19): Unescaped less-than sign (<) in text content; should be &lt;-->
    <!--Error 5 (Line 26): Typo in input type attribute value "emial"; should be "email"-->
    <!--Error 6 (Line 19): Block element <h2> not allowed inside inline <span> element; change <span id="content"> to <div id="content"> -->
    <!--Error 7 (Line 21): Forgot to put semicolon after &amp;-->
    <!--Error 8 (Line 55): Has another closing body tag -->
    <!--Error 9 (Line 55): Has another closing html tag -->
    <!--Error 10 (Line 38): Wrong ID in datalist -->
    <!--Error 11 (Line 49): Min attribute value is greater than max attribute value -->


    <div id="header"> 
        <h1>e-Ticket <span>Your Campus Cinema</span></h1> 
    </div> 

    <div id="content"> 
        <h2>Book Your Ticket</h2> 
        <p>Promotion: tickets &lt;RM10 for students &amp; staff!</p>

        <form action="booking.php" oninput="total.value = adult.value + child.value"> 
            <label for="name">Name:</label> 
            <input type="text" id="name" name="name" placeholder="Enter your name" required autofocus><br> 
            <label for="email">E-mail:</label> 
            <input type="email" id="email" name="email"><br> 
            <label for="date">Show date:</label> 
            <input type="date" id="date" name="date"><br> 
            <label for="movie">Movie:</label> 
            <input id="movie" name="movie" list="movies"><br> 
            
            <datalist id="movies"> 
                <option value="Space Rangers">
                <option value="Kampung Comedy"> 
            </datalist> 

            <label for="adult">Adult tickets:</label> 
            <input type="number" id="adult" name="adult" value="0"><br> 
            <label for="child">Child tickets:</label> 
            <input type="number" id="child" name="child" value="0"><br> 
            <label for="rating">Rate our service:</label> 
            <input type="range" id="rating" name="rating" min="1" max="5"><br> 
            Total tickets: <output name="total" for="adult child"></output><br> 
            <input type="submit" value="Book Now"> 
        </form> 
    </div> 
    
    <div id="footer"> 
        <p>&copy; 2026 CineKampus. All rights reserved.</p> 
    </div> 

</body> 
</html>
