<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stail Link</title>
    <style type = "text/css">
        a:link {
            color: #FF0000  /* Unvisited link */
        }

        a:visited {
            color: #00FF00 /* Visited link */
        }

        a:hover {
            color: #FF0000  /* Mouse over link */
        }

        a:active {
            color: #0000FF  /* Selected link */
        }


    </style>
</head>
<body>
    <p><b><a href="default.asp" target="_blank">Ini adalah pautan</a></b></p>
</body>
</html>
