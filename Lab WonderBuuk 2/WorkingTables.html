<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working with Tables</title>
</head>
<body>
    <table>
        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Grade</th>
        </tr>
        <table>
        <tr>
            <th>John Doe</th>
            <th>Mathematics</th>
            <th>A</th>
        </tr>
        <table>
        <tr>
            <th>Jane Smith</th>
            <th>Science</th>
            <th>B+</th>
        </tr>
    </table>

    <table border = "1">
        <tr>
            <th colspan = "2">Student Information</th>
        </tr>
        <tr>
            <td>Name</td>
            <td>John Doe</td>
        </tr>
        <tr>
            <td colspan = "2">Mathematics</td>
        </tr>
    </table>
    
</body>
</html>
